name: .NET Build and Publish

on:
  release:
    types: [published]

jobs:
  build:
    # Windows Forms / net9.0-windows のため windows-latest を指定
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      # テストプロジェクトがある場合は有効化してください（現在は無いためコメントアウトまたは省略可能）
      # - name: Test
      #   run: dotnet test --no-build --verbosity normal

      - name: Publish Win-x64 Executable
        run: >
          dotnet publish TaskManagerTrayWidget/TaskManagerTrayWidget.csproj
          -c Release
          -r win-x64
          --no-self-contained
          -p:PublishSingleFile=true
          -o ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskManagerTrayWidget-win-x64
          path: ./publish/
