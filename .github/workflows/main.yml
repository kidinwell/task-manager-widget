name: .NET Build and Publish

on:
  release:
    types: [published]

# リリースへの書き込み権限（必須）
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Publish Win-x64 Executable
        run: >
          dotnet publish TaskManagerTrayWidget/TaskManagerTrayWidget.csproj
          -c Release
          -r win-x64
          --no-self-contained
          -p:PublishSingleFile=true
          -o ./publish

      # 配布用に ZIP アーカイブを作成
      - name: Create ZIP archive
        run: Compress-Archive -Path ./publish/* -DestinationPath ./TaskManagerTrayWidget-win-x64.zip

      # GitHub Releases の Assets に exe と zip を添付
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} ./TaskManagerTrayWidget-win-x64.zip ./publish/TaskManagerTrayWidget.exe --clobber
